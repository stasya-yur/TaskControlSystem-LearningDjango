<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h1>{{object.title}}</h1>
<p><strong>Опис:</strong> {{object.text}}</p>
<p><strong>Пріорітет: </strong>{{object.priority}}</p>

<a href="{% url 'task_update' object.pk %}">Редагувати</a>
<a href="{% url 'task_delete' object.pk %}" style="color:#a33939;">Видалити</a>
<hr>
<a href="{% url 'task_list' %}">Назад до списку</a>
</body>
</html>
